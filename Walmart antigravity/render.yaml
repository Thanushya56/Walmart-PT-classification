services:
  - type: web
    name: walmart-pt-classification
    env: node
    rootDir: Walmart antigravity
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
